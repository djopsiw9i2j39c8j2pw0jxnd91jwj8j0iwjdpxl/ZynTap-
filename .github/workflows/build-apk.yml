name: Build ZynTap APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản app, ví dụ 1.00.02 (để trống = lấy trong gradle.properties)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle (có cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Xác định phiên bản
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$INPUT_VERSION" ]]; then V="$INPUT_VERSION"; fi
          if [[ -z "$V" ]]; then V="$(grep '^appVersion=' gradle.properties | cut -d= -f2)"; fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Phiên bản '$V' sai định dạng, cần dạng 1.00.01"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Phiên bản build: $V"

      - name: Cấp quyền chạy cho gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease -PappVersion=${{ steps.ver.outputs.version }} --no-daemon --stacktrace

      - name: Đổi tên file APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ZynTap-${{ steps.ver.outputs.version }}.apk"

      - name: Tải APK lên (tab Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ZynTap-${{ steps.ver.outputs.version }}
          path: dist/ZynTap-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Đăng lên Releases (khi đẩy tag v...)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZynTap-${{ steps.ver.outputs.version }}.apk
