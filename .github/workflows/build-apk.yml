name: Build ZynTap APK

on:
  push:
    branches: [main, master, "perf/zyntap-v7.4"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản app, ví dụ 1.00.02 (để trống = lấy trong gradle.properties)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài Gradle (có cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Khóa ký (mặc định dùng app/zyntap-release.jks trong repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.ZYNTAP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/zyntap-release.jks
          fi
          test -f app/zyntap-release.jks

      - name: Xác định phiên bản
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$INPUT_VERSION" ]]; then V="$INPUT_VERSION"; fi
          if [[ -z "$V" ]]; then V="$(grep '^appVersion=' gradle.properties | cut -d= -f2)"; fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Phiên bản '$V' sai định dạng, cần dạng 1.00.01"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Phiên bản build: $V"

      - name: Cấp quyền chạy cho gradlew
        run: chmod +x gradlew

      - name: Kiểm thử phục hồi cảm ứng và build APK
        env:
          ZYNTAP_STORE_PASSWORD: ${{ secrets.ZYNTAP_STORE_PASSWORD }}
          ZYNTAP_KEY_PASSWORD: ${{ secrets.ZYNTAP_KEY_PASSWORD }}
          ZYNTAP_KEY_ALIAS: ${{ secrets.ZYNTAP_KEY_ALIAS }}
        run: ./gradlew testReleaseUnitTest assembleRelease -PappVersion=${{ steps.ver.outputs.version }} --no-daemon --stacktrace

      - name: Ký lại v1+v2+v3 và kiểm tra chữ ký
        env:
          ZYNTAP_STORE_PASSWORD: ${{ secrets.ZYNTAP_STORE_PASSWORD }}
          ZYNTAP_KEY_PASSWORD: ${{ secrets.ZYNTAP_KEY_PASSWORD }}
          ZYNTAP_KEY_ALIAS: ${{ secrets.ZYNTAP_KEY_ALIAS }}
        run: |
          mkdir -p dist
          OUT="dist/ZynTap-${{ steps.ver.outputs.version }}.apk"
          KS_PASS="${ZYNTAP_STORE_PASSWORD:-$(grep '^zynStorePassword=' gradle.properties | cut -d= -f2)}"
          KEY_PASS="${ZYNTAP_KEY_PASSWORD:-$(grep '^zynKeyPassword=' gradle.properties | cut -d= -f2)}"
          ALIAS="${ZYNTAP_KEY_ALIAS:-zyntap}"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # AGP tự tắt v1 khi minSdk >= 24, nên ký lại bằng apksigner với min-sdk 23 để có đủ v1+v2+v3
          "$APKSIGNER" sign --ks app/zyntap-release.jks --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 23 --out "$OUT" app/build/outputs/apk/release/app-release.apk
          # verify cũng đọc minSdk=26 trong manifest nên mặc định bỏ qua v1 -> phải ép --min-sdk-version 23
          "$APKSIGNER" verify --min-sdk-version 23 --verbose --print-certs "$OUT" | tee sig.txt
          unzip -l "$OUT" | grep -E "META-INF/.*\.(SF|RSA)"
          grep -q "v1 scheme (JAR signing): true" sig.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" sig.txt
          grep -q "v3 scheme (APK Signature Scheme v3): true" sig.txt

      - name: Tải APK lên (tab Actions → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ZynTap-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Đăng lên Releases (khi đẩy tag v...)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
